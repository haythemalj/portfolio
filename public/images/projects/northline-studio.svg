<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title">
  <title id="title">Northline Studio concept landing page</title>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f6f3ee"/>
      <stop offset="1" stop-color="#e4ebdf"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4f8063"/>
      <stop offset="1" stop-color="#193d2d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#background)"/>
  <rect x="690" y="0" width="510" height="700" fill="url(#panel)"/>
  <circle cx="1000" cy="170" r="220" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="1000" cy="170" r="155" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/>
  <text x="90" y="120" fill="#263c30" font-family="Arial,sans-serif" font-size="35" font-weight="700">northline.</text>
  <text x="92" y="255" fill="#476e54" font-family="Arial,sans-serif" font-size="20" letter-spacing="7">INDEPENDENT DIGITAL STUDIO</text>
  <text x="88" y="365" fill="#17231f" font-family="Georgia,serif" font-size="92">Digital with</text>
  <text x="88" y="465" fill="#316d54" font-family="Georgia,serif" font-size="92" font-style="italic">direction.</text>
  <rect x="90" y="530" width="185" height="58" rx="29" fill="#17231f"/>
  <text x="128" y="567" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">LET'S TALK</text>
  <rect x="800" y="310" width="265" height="235" rx="4" fill="#d8f278" transform="rotate(-7 800 310)"/>
  <text x="845" y="375" fill="#263c30" font-family="Arial,sans-serif" font-size="18" letter-spacing="4">NORTHLINE / 01</text>
  <text x="832" y="455" fill="#17231f" font-family="Georgia,serif" font-size="48">Make it</text>
  <text x="832" y="510" fill="#17231f" font-family="Georgia,serif" font-size="48">matter.</text>
</svg>
