    <text x="905" y="500" font-family="Arial,sans-serif" font-size="40" font-weight="900" fill="#fff">CLUB</text>
    <text x="905" y="530" font-family="Arial,sans-serif" font-size="18" fill="#fff" opacity=".85">RECRUITMENT 2024</text>
