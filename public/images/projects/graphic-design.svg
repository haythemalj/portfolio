  <text x="80" y="320" font-family="Arial,sans-serif" font-size="22" fill="#bfb3d6">Posters · Social campaigns · Event visuals · Motion-ready assets</text>
  <g font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">
    <rect x="80" y="370" width="150" height="40" rx="20" fill="#fff" fill-opacity=".1"/><text x="107" y="396">Photoshop</text>
    <rect x="245" y="370" width="150" height="40" rx="20" fill="#fff" fill-opacity=".1"/><text x="275" y="396">Illustrator</text>
    <rect x="410" y="370" width="170" height="40" rx="20" fill="#fff" fill-opacity=".1"/><text x="442" y="396">After Effects</text>
  </g>
  <g transform="rotate(-8 900 360)">
