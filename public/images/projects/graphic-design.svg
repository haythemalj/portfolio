<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t">
  <title id="t">Graphic Design Portfolio</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15121f"/><stop offset="1" stop-color="#2a1a3d"/></linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d6d"/><stop offset="1" stop-color="#ff9a3c"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4dd4ff"/><stop offset="1" stop-color="#6a5cff"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8ff4d"/><stop offset="1" stop-color="#2bd98a"/></linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <text x="80" y="110" font-family="Arial,sans-serif" font-size="20" fill="#ff9a3c" letter-spacing="6">SELECTED WORK · 2021 — 2025</text>
  <text x="80" y="190" font-family="Arial,sans-serif" font-size="66" font-weight="700" fill="#fff">Graphic Design</text>
