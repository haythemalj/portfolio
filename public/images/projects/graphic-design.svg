    <text x="790" y="430" font-family="Arial,sans-serif" font-size="46" font-weight="900" fill="#fff" opacity=".9">EVENT</text>
    <text x="790" y="470" font-family="Arial,sans-serif" font-size="20" fill="#fff" opacity=".8">NIGHT · VOL. 03</text>
