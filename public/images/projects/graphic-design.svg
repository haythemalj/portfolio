  <rect x="640" y="400" width="180" height="180" rx="18" fill="url(#p3)"/>
  <text x="662" y="505" font-family="Arial,sans-serif" font-size="56" font-weight="900" fill="#15121f">-30%</text>
  <text x="80" y="640" font-family="Arial,sans-serif" font-size="16" fill="#8b7fa6">3+ years designing for student clubs, brands and digital campaigns</text>
