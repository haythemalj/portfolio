  <text x="193" y="434" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">View Projects</text>
  <!-- cards -->
  <g>
    <rect x="160" y="490" width="270" height="110" rx="12" fill="#161616" stroke="#2a2a2a"/><rect x="160" y="490" width="270" height="60" rx="12" fill="#1f1f1f"/><rect x="178" y="566" width="150" height="10" rx="5" fill="#444"/>
    <rect x="455" y="490" width="270" height="110" rx="12" fill="#161616" stroke="#2a2a2a"/><rect x="455" y="490" width="270" height="60" rx="12" fill="#1f1f1f"/><rect x="473" y="566" width="170" height="10" rx="5" fill="#444"/>
    <rect x="750" y="490" width="270" height="110" rx="12" fill="#161616" stroke="#2a2a2a"/><rect x="750" y="490" width="270" height="60" rx="12" fill="#1f1f1f"/><rect x="768" y="566" width="130" height="10" rx="5" fill="#444"/>
