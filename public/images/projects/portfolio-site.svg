<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t">
  <title id="t">Portfolio Website built with Laravel</title>
  <defs>
    <radialGradient id="glow" cx=".8" cy=".1" r=".8"><stop offset="0" stop-color="#e50000" stop-opacity=".35"/><stop offset="1" stop-color="#080808" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="700" fill="#080808"/>
