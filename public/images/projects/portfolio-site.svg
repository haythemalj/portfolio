  <rect x="120" y="90" width="960" height="540" rx="18" fill="#111" stroke="#2a2a2a"/>
  <rect x="120" y="90" width="960" height="52" rx="18" fill="#161616"/>
  <circle cx="156" cy="116" r="7" fill="#ff5f57"/><circle cx="180" cy="116" r="7" fill="#febc2e"/><circle cx="204" cy="116" r="7" fill="#28c840"/>
