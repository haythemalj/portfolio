<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Offline · Haythem Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top,rgba(229,0,0,.12),transparent 45%),#0a0a0a;color:#e6e6e6;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
img{width:72px;height:72px;border-radius:16px;margin-bottom:18px}
h1{font-size:1.3rem;margin-bottom:8px}
p{color:#8d8d8d;max-width:320px;margin:0 auto 20px;line-height:1.5}
button{background:#e50000;color:#fff;border:0;border-radius:10px;padding:12px 22px;font:600 .95rem system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<div>
  <img src="/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>The dashboard needs an internet connection. Check your Wi-Fi or mobile data and try again.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
